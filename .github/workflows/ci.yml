name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.backlog/**'
      - 'prototypes/**'
      - 'obsidian/**'
      - 'linkwarden-docs/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.backlog/**'
      - 'prototypes/**'
      - 'obsidian/**'
      - 'linkwarden-docs/**'
  schedule:
    - cron: '17 3 * * 1'

# Read-only by default; no job here needs to write to the repository.
permissions:
  contents: read

jobs:
  rust-lint:
    name: Rust Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e43eeffd51aefeea929f4ea14e09fd077153e788 # 1.94.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: backend
          # Keyed separately from the test job: caches are immutable per key,
          # and clippy's check-only artifacts are useless for building test
          # binaries — sharing a key let lint's save block the test job's.
          shared-key: backend-lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Confine user deletion to the account purge repository
        run: |
          if grep -rn "DELETE FROM users" crates apps --include='*.rs' \
            | grep -v "account_purge_repo.rs" | grep -v "/tests/"; then
            echo "DELETE FROM users may only live in account_purge_repo.rs" >&2
            exit 1
          fi

  rust-test:
    name: Rust Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Full debuginfo for a workspace this size overflows the ~14 GB free on
      # hosted runners; line tables keep file:line in backtraces at a fraction
      # of the disk cost.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free runner disk space
        working-directory: /
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - name: Point renderer tests at the preinstalled browser
        # Hosted runners ship google-chrome but nothing named `chromium`,
        # which is what the renderer's auto-detection falls back to.
        run: |
          BROWSER=$(command -v google-chrome || command -v chromium-browser || command -v chromium)
          echo "CHROMIUM_PATH=$BROWSER" >> "$GITHUB_ENV"
          echo "using $BROWSER"
      - uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1
      - uses: dtolnay/rust-toolchain@e43eeffd51aefeea929f4ea14e09fd077153e788 # 1.94.1
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: backend
          shared-key: backend-test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --all-features
      # Runs after the suite so the test binaries are already built: this only
      # lists them and checks every pinned invariant still resolves.
      - run: ../scripts/verify-test-invariants.sh

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec svelte-kit sync
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm i18n:check

  extension:
    name: Extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Test release version management
        working-directory: .
        run: node --test scripts/release-version.test.mjs scripts/self-hosting-installer.test.mjs
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check
      - run: npm run i18n:check
      - run: npm run dom-preprocessor:check
      - run: npm test

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: ./gradlew --no-daemon :composeApp:i18nCheck :composeApp:compileCommonMainKotlinMetadata :composeApp:jvmTest :composeApp:assembleDebug

  mobile-ios:
    name: Mobile (iOS compile)
    # The Xcode project is format 77, which needs Xcode 16.3+; macos-14 tops
    # out at Xcode 15.4.
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: ./gradlew --no-daemon :composeApp:compileKotlinIosSimulatorArm64 :composeApp:linkDebugFrameworkIosSimulatorArm64
      - name: Compile iOS share extension
        run: >-
          xcodebuild
          -project iosApp/iosApp.xcodeproj
          -target IndelibleShareExtension
          -configuration Debug
          -sdk iphonesimulator
          FRAMEWORK_SEARCH_PATHS='${{ github.workspace }}/mobile/composeApp/build/bin/iosSimulatorArm64/debugFramework'
          CODE_SIGNING_ALLOWED=NO
          build
