name: Docker

# CI-success runs publish the development channel. Release preparation calls
# this workflow with a draft release tag and publishes only immutable X.Y.Z
# tags; floating stable aliases are advanced after the draft is published.
on:
  workflow_call:
    inputs:
      release_tag:
        description: Draft release tag whose exact images should be published
        required: true
        type: string
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.event.workflow_run.head_sha || inputs.release_tag || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' }}

jobs:
  resolve:
    name: Resolve build source
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      mode: ${{ steps.source.outputs.mode }}
      ref: ${{ steps.source.outputs.ref }}
      source-sha: ${{ steps.source.outputs.source_sha || steps.release-source.outputs.source_sha }}
      short-sha: ${{ steps.source.outputs.short_sha }}
      version: ${{ steps.source.outputs.version }}
      has-image-manifest: ${{ steps.source.outputs.has_image_manifest }}
    steps:
      - name: Resolve ref and release mode
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            sha="${{ github.event.workflow_run.head_sha }}"
            {
              echo "mode=development"
              echo "ref=$sha"
              echo "source_sha=$sha"
              echo "short_sha=${sha:0:7}"
              echo "version="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release_tag must be a stable vX.Y.Z tag"
            exit 1
          fi
          release="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets)"
          draft="$(jq -r '.isDraft' <<< "$release")"
          if [[ "$draft" != "true" ]]; then
            echo "::error::$RELEASE_TAG must identify an unpublished draft release"
            exit 1
          fi
          if jq -e 'any(.assets[]; .name == "release-images.json")' <<< "$release" > /dev/null; then
            has_image_manifest=true
          else
            has_image_manifest=false
          fi

          {
            echo "has_image_manifest=$has_image_manifest"
            echo "mode=release"
            echo "ref=$RELEASE_TAG"
            echo "version=${RELEASE_TAG#v}"
            echo "short_sha="
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: ${{ steps.source.outputs.mode == 'release' }}
        with:
          ref: ${{ steps.source.outputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Record release source
        id: release-source
        if: ${{ steps.source.outputs.mode == 'release' }}
        run: echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    needs: resolve
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        image: [ind-api, ind-worker, ind-renderer]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false

      - name: Resolve image inputs
        id: image
        run: |
          case "${{ matrix.image }}" in
            ind-api)
              echo "context=." >> "$GITHUB_OUTPUT"
              echo "dockerfile=backend/apps/ind-api/Dockerfile" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "context=backend" >> "$GITHUB_OUTPUT"
              echo "dockerfile=backend/apps/${{ matrix.image }}/Dockerfile" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for an existing exact release image
        if: ${{ needs.resolve.outputs.mode == 'release' }}
        id: existing
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          if output="$(docker buildx imagetools inspect "$IMAGE" 2>&1)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -Eqi 'not found|manifest unknown|name unknown' <<< "$output"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not determine whether $IMAGE exists"
            printf '%s\n' "$output" >&2
            exit 1
          fi

      - id: build
        if: ${{ needs.resolve.outputs.mode == 'development' || needs.resolve.outputs.has-image-manifest != 'true' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ steps.image.outputs.context }}
          file: ${{ steps.image.outputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Export digest
        if: ${{ needs.resolve.outputs.mode == 'development' || needs.resolve.outputs.has-image-manifest != 'true' }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ needs.resolve.outputs.mode == 'development' || needs.resolve.outputs.has-image-manifest != 'true' }}
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  merge:
    name: Publish ${{ matrix.image }} manifest
    needs: [resolve, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [ind-api, ind-worker, ind-renderer]
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for an existing exact release image
        if: ${{ needs.resolve.outputs.mode == 'release' }}
        id: existing
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          if output="$(docker buildx imagetools inspect "$IMAGE" 2>&1)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -Eqi 'not found|manifest unknown|name unknown' <<< "$output"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not determine whether $IMAGE exists"
            printf '%s\n' "$output" >&2
            exit 1
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ needs.resolve.outputs.mode == 'development' || needs.resolve.outputs.has-image-manifest != 'true' }}
        with:
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
          path: /tmp/digests

      - name: Publish manifest with immutable exact-tag guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          MODE: ${{ needs.resolve.outputs.mode }}
          SHORT_SHA: ${{ needs.resolve.outputs.short-sha }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source-sha }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$MODE" == "development" ]]; then
            sources=()
            for digest in /tmp/digests/*; do
              sources+=("$IMAGE@sha256:${digest##*/}")
            done
            docker buildx imagetools create \
              -t "$IMAGE:dev" \
              -t "$IMAGE:$SHORT_SHA" \
              "${sources[@]}"
            docker buildx imagetools inspect "$IMAGE:$SHORT_SHA" > /tmp/inspect.txt
            exit 0
          fi

          exact="$IMAGE:$VERSION"
          if [[ "${{ needs.resolve.outputs.has-image-manifest }}" == "true" ]]; then
            mkdir -p /tmp/prior-release
            gh release download "v$VERSION" --pattern release-images.json --dir /tmp/prior-release
            jq -e \
              --arg tag "v$VERSION" \
              --arg version "$VERSION" \
              --arg source "$SOURCE_SHA" \
              --arg image "${{ matrix.image }}" \
              --arg reference "$exact" \
              '.tag == $tag
                and .version == $version
                and .source == $source
                and .images[$image].reference == $reference' \
              /tmp/prior-release/release-images.json > /dev/null
            expected="$(jq -r --arg image "${{ matrix.image }}" '.images[$image].digest // empty' /tmp/prior-release/release-images.json)"
            if [[ ! "$expected" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::The draft does not record a valid digest for $exact"
              exit 1
            fi
            if [[ "${{ steps.existing.outputs.exists }}" == "true" ]]; then
              digest="$(docker buildx imagetools inspect "$exact" --format '{{json .Manifest.Digest}}' | jq -r .)"
            else
              docker buildx imagetools inspect "$IMAGE@$expected" > /dev/null
              docker buildx imagetools create -t "$exact" "$IMAGE@$expected"
              digest="$(docker buildx imagetools inspect "$exact" --format '{{json .Manifest.Digest}}' | jq -r .)"
            fi
            if [[ "$expected" != "$digest" ]]; then
              echo "::error::$exact resolves to $digest, but the draft records ${expected:-no digest}"
              exit 1
            fi
            echo "$exact matches the recorded release digest"
          else
            sources=()
            for digest_file in /tmp/digests/*; do
              sources+=("$IMAGE@sha256:${digest_file##*/}")
            done
            docker buildx imagetools create --dry-run "${sources[@]}" > /tmp/candidate.json
            candidate_children="$(jq -c '[.manifests[].digest] | sort' /tmp/candidate.json)"
            if docker buildx imagetools inspect "$exact" --raw \
              > /tmp/existing.json 2> /tmp/existing.err; then
              existing_children="$(jq -c '[.manifests[].digest] | sort' /tmp/existing.json)"
              if [[ "$existing_children" != "$candidate_children" ]]; then
                echo "::error::$exact already exists with different image manifests"
                exit 1
              fi
            elif ! grep -Eqi 'not found|manifest unknown|name unknown' /tmp/existing.err; then
              echo "::error::Could not determine whether $exact appeared concurrently"
              cat /tmp/existing.err >&2
              exit 1
            else
              docker buildx imagetools create -t "$exact" "${sources[@]}"
            fi
          fi

          docker buildx imagetools inspect "$exact" | tee /tmp/inspect.txt
          for arch in amd64 arm64; do
            grep -q "linux/$arch" /tmp/inspect.txt || {
              echo "::error::$exact is missing linux/$arch"
              exit 1
            }
          done

          digest="$(docker buildx imagetools inspect "$exact" --format '{{json .Manifest.Digest}}' | jq -r .)"
          jq -n \
            --arg name "${{ matrix.image }}" \
            --arg reference "$exact" \
            --arg digest "$digest" \
            --arg version "$VERSION" \
            --arg source "$SOURCE_SHA" \
            '{name: $name, reference: $reference, digest: $digest, version: $version, source: $source}' \
            > "/tmp/release-image-${{ matrix.image }}.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ needs.resolve.outputs.mode == 'release' }}
        with:
          name: release-image-${{ matrix.image }}
          path: /tmp/release-image-${{ matrix.image }}.json
          retention-days: 7
          if-no-files-found: error
