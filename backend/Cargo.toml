[workspace]
members = [
    "apps/ind-api",
    "apps/ind-worker",
    "apps/ind-renderer",
    "apps/ind-cli",
    "crates/ind-domain",
    "crates/ind-config",
    "crates/ind-application",
    "crates/ind-persistence",
    "crates/ind-auth",
    "crates/ind-search",
    "crates/ind-ai",
    "crates/ind-html",
    "crates/ind-egress",
    "crates/ind-ingest",
    "crates/ind-integrations",
    "crates/ind-http-api",
    "crates/ind-observability",
    "crates/ind-test-support",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "AGPL-3.0-or-later"
rust-version = "1.94.1"

# Panic-family lints denied workspace-wide. Production code must propagate
# errors (DomainError -> AppError -> ApiError) rather than panic. Genuine
# invariants/boot preconditions use #[expect(<lint>, reason = "...")] per site.
# Tests are exempt via clippy.toml (allow-*-in-tests). See docs/panic-audit.md.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
# Internal crates
ind-domain = { path = "crates/ind-domain" }
ind-config = { path = "crates/ind-config" }
ind-application = { path = "crates/ind-application" }
ind-persistence = { path = "crates/ind-persistence" }
ind-auth = { path = "crates/ind-auth" }
ind-search = { path = "crates/ind-search" }
ind-ai = { path = "crates/ind-ai" }
ind-html = { path = "crates/ind-html" }
ind-egress = { path = "crates/ind-egress" }
ind-ingest = { path = "crates/ind-ingest" }
ind-integrations = { path = "crates/ind-integrations" }
ind-http-api = { path = "crates/ind-http-api" }
ind-observability = { path = "crates/ind-observability" }
ind-test-support = { path = "crates/ind-test-support" }
ind-worker = { path = "apps/ind-worker" }
ind-api = { path = "apps/ind-api" }

# External dependencies
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
async-trait = "0.1.89"
uuid = { version = "1", features = ["v5", "v7", "serde"] }
axum = { version = "0.8.8", features = ["multipart"] }
tower = "0.5.3"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate", "ipnetwork"] }
utoipa = { version = "5.4.0", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }
utoipa-scalar = { version = "0.3", features = ["axum"] }
tower-http = { version = "0.6", features = ["cors", "trace", "request-id", "propagate-header", "set-header", "fs"] }
http = "1"
oauth2 = "5"
openidconnect = "4.0.1"
jsonwebtoken = "9"
reqwest = { version = "0.13.2", features = ["json"] }
feed-rs = "2"
quick-xml = { version = "0.37", features = ["serialize"] }
chrono = { version = "0.4", features = ["serde"] }
serde_with = { version = "3.18.0", features = ["chrono_0_4", "macros", "schemars_1"] }
argon2 = "0.5.3"
base64 = "0.22"
rand = "0.9"
validator = { version = "0.20.0", features = ["derive"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
hound = "3.5.1"
aes-gcm = "0.10"
hkdf = "0.12"
subtle = "2"
dotenvy = "0.15"
config = { version = "0.15.22", features = ["toml"] }
secrecy = { version = "0.10.3", features = ["serde"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
ipnet = "2"
percent-encoding = "2"
# default-features = false drops the SDK's legacy hyper 0.14 + rustls 0.21
# connector (RUSTSEC-flagged rustls-webpki 0.101); default-https-client is the
# maintained hyper 1 + rustls 0.23 stack.
aws-sdk-s3 = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio", "sigv4a"] }
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio", "credentials-process", "sso"] }
bytes = "1"
apalis = { version = "1.0.0-rc.6", features = ["default"] }
apalis-postgres = "1.0.0-rc.6"
chromiumoxide = { version = "0.9.1", default-features = false }
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
ulid = "1"
mimalloc = { version = "0.1", default-features = false }
libmimalloc-sys = { version = "0.1", default-features = false, features = ["extended"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
infer = { version = "0.19", default-features = false }
csv = "1"
minijinja = { version = "2.15.1", features = ["loader"] }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
pdf_oxide = { version = "0.3.60", features = ["rendering"] }
svix = "1"
ammonia = "4"
scraper = "0.26.0"
html2md = "0.2.15"
lol_html = "3"
wiremock = "0.6"
whatlang = "0.18.0"
isolang = { version = "2.4.0", default-features = false }

[profile.dev.package.pdf_oxide]
opt-level = 3
