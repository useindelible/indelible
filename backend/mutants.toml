all_features = true
additional_cargo_test_args = ["-j", "4"]
cap_lints = true
minimum_test_timeout = 180.0
test_package = [
  "ind-ai",
  "ind-api",
  "ind-application",
  "ind-auth",
  "ind-persistence",
  "ind-worker",
]
test_tool = "nextest"
test_workspace = false
timeout_multiplier = 3.0
examine_globs = [
  "crates/ind-auth/src/api_token.rs",
  "crates/ind-auth/src/refresh_token.rs",
  "crates/ind-persistence/src/repos/entity_repo/resolution.rs",
  "crates/ind-persistence/src/repos/document_lifecycle_repo/mod.rs",
  "crates/ind-persistence/src/repos/document_lifecycle_repo/save.rs",
  "crates/ind-persistence/src/repos/background_job_recovery_repo.rs",
  "crates/ind-persistence/src/repos/search_repo/fts.rs",
  "crates/ind-application/src/services/tts/synthesis/service.rs",
  "crates/ind-ai/src/chat/streaming.rs",
  "crates/ind-ai/src/embed/mod.rs",
  "apps/ind-worker/src/failure.rs",
  "apps/ind-worker/src/jobs/integrations/readwise/job.rs",
]
examine_re = [
  "delete ! in ApiTokenService.*validate_api_token",
  "replace \\|\\| with && in RefreshTokenService::rotate",
  "replace PgEntityRepository::find_for_resolution_impl ->.*Ok\\(None\\)",
  "delete match arm DocumentOriginType::FeedSourceEntry in <impl DocumentLifecycle.*materialize_document",
  "delete match arm DocumentOriginType::FeedSourceEntry in save_to_library",
  "replace <impl BackgroundJobRecoveryRepository for PgBackgroundJobRecoveryRepository>::mark_recovery_terminal ->",
  "replace PgSearchRepository::search_fts_impl ->.*Ok\\(vec!\\[\\]\\)",
  "replace canonicalize_sender_filter ->",
  "delete ! in SynthesisService::synthesize_chunk",
  "replace sanitize_source_tokens ->",
  "replace EmbeddingIndexer::embed_document ->",
  "delete match arm AppError::RateLimited in classify_error",
  "replace handle_readwise_import ->",
]
