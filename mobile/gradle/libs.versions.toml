junit = "4.13.2"
kotlin = "2.3.0"
kotlinx-coroutines = "1.10.2"
kotlinx-datetime = "0.6.2"
kotlinx-serialization = "1.8.1"
ktor = "3.1.3"
material3 = "1.10.0-alpha05"
coil = "3.1.0"
koin = "4.1.0"
markdown-renderer = "0.35.0"
ktlint = "14.2.0"
detekt = "1.23.8"
