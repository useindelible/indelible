androidx-lifecycle = "2.9.6"
androidx-security-crypto = "1.1.0-alpha06"
androidx-splashscreen = "1.0.1"
androidx-navigation = "2.9.0-alpha14"
androidx-testExt = "1.3.0"
androidx-testRunner = "1.7.0"
composeHotReload = "1.0.0"
